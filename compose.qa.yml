# Entorno QA del plan C: lo levanta el pipeline (job deploy-qa) en el
# self-hosted runner, NUNCA a mano. Diferencias con el entorno hermano:
#   - name: proyecto de Compose propio (sin esto, desplegar uno mata al otro)
#   - puertos del lado host: web 8081, api 8001
#   - volumen propio: cada entorno tiene SU base de datos
# Las imagenes NO se construyen aca: se bajan del registry por la etiqueta
# sha-<commit> que publico el CI (Docker Hub: el Docker de la notebook no puede
# leer ghcr.io). TAG y DB_PASSWORD los pone el pipeline.
name: salas-qa

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: salas
      POSTGRES_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD}
      POSTGRES_DB: salas_qa
    volumes:
      - datos_db_qa:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salas -d salas_qa"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    image: docker.io/facuolivam/salas-backend:${TAG:?falta TAG}
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: salas
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: salas_qa
      # Sentry (TP9). El DSN no es un secreto: identifica el proyecto,
      # no da acceso a leer nada.
      SENTRY_DSN: https://d0df78ed9458475d3f71e49bcb7d3df1@o4512325542150144.ingest.us.sentry.io/4512325564628992
      SENTRY_ENVIRONMENT: qa
      SENTRY_RELEASE: ${TAG}
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: docker.io/facuolivam/salas-frontend:${TAG}
    environment:
      # Se lee al arrancar (template de nginx). Es la misma imagen en los dos
      # entornos; lo que cambia es a que api apunta.
      BACKEND_URL: http://backend:8000
    ports:
      - "8081:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  datos_db_qa:
