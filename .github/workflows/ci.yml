name: CI

# Cuándo corre. Son dos disparadores distintos y responden preguntas distintas:
#
#   pull_request  → "¿este cambio se puede integrar?"  Corre ANTES del merge, sobre
#                   la fusión tentativa de la rama con main. Es el que actúa de gate.
#   push a main   → "¿main sigue sano?"  Corre DESPUÉS del merge, sobre lo que
#                   quedó realmente en la rama principal.
#
# El segundo no es redundante: entre que un PR se verifica y se mergea, main pudo
# haberse movido por otro merge.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# GITHUB_TOKEN con lo justo: leer el codigo y escribir paquetes en ghcr.io.
permissions:
  contents: read
  packages: write

jobs:
  # Los dos jobs son independientes: no comparten disco, ni red, ni variables.
  # Cada uno corre en su propia máquina virtual, así que se ejecutan en paralelo
  # sin que haya que pedirlo. El pipeline tarda lo que tarda el más lento, no la
  # suma de los dos.
  backend:
    name: Build imagen del backend
    runs-on: ubuntu-latest
    steps:
      - name: Traer el código
        uses: actions/checkout@v4

      # Buildx es el constructor extendido de Docker. Hace falta para poder
      # exportar e importar el caché de capas, que el build clásico no sabe hacer.
      - name: Preparar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir con el Dockerfile del repositorio
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          # No se publica nada acá: este paso verifica que la imagen final
          # compila. Publicar es otra decisión y otro TP.
          push: false
          tags: salas-backend:ci
          # El caché vive en el almacenamiento de GitHub Actions, no en el runner
          # —que se destruye al terminar—. El scope separa el caché de cada imagen:
          # sin él, los dos jobs se pisarían las capas entre sí.
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # ---- TP5: tests + coverage + umbral ----
      # Se construye la etapa `test` del Dockerfile (parte de `build`) y se
      # corre. Su propio scope de cache: ahora son cuatro builds distintos.
      - name: Construir la etapa de tests
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: test
          load: true            # sin esto el docker run no encuentra la imagen
          push: false
          tags: backend-test:ci
          cache-from: type=gha,scope=backend-test
          cache-to: type=gha,mode=max,scope=backend-test

      # pytest sale con codigo != 0 si falla un test O si la cobertura queda
      # abajo de --cov-fail-under (pytest.ini). Cualquiera de los dos pone el
      # job en rojo, y como el job es required check, frena el merge.
      - name: Correr los tests con coverage (umbral en pytest.ini)
        run: docker run --rm -v "${{ github.workspace }}/out:/out" backend-test:ci

      - name: Resumen de coverage en la corrida
        if: ${{ !cancelled() }}
        run: |
          echo "## Coverage del backend (pytest-cov, lineas + ramas)" >> $GITHUB_STEP_SUMMARY
          docker run --rm --entrypoint coverage -v "${{ github.workspace }}/out:/out" backend-test:ci             report --format=markdown >> $GITHUB_STEP_SUMMARY

      - name: Publicar coverage y resultados
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-backend
          path: |
            out/htmlcov
            out/coverage.xml
            out/tests.xml

      # ---- TP6: publicar el artefacto ----
      # ULTIMOS pasos del job: solo se llega aca si la imagen compilo y los
      # tests + el umbral pasaron. Y solo en main: un PR verifica, no publica.
      # La etiqueta es el commit: sha-<commit> dice exactamente de que codigo
      # salio la imagen. No se publica `latest` (ver decisiones.md, TP6/TP7).
      - name: Entrar al registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Entrar a Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: facuolivam
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y publicar la imagen
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          # El MISMO build se etiqueta en los dos registries: es un solo digest.
          # Docker Hub es el que baja el runner (su Docker no puede leer ghcr.io).
          tags: |
            ghcr.io/facuolivamar/salas-backend:sha-${{ github.sha }}
            docker.io/facuolivam/salas-backend:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=backend

  frontend:
    name: Build imagen del frontend
    runs-on: ubuntu-latest
    steps:
      - name: Traer el código
        uses: actions/checkout@v4

      - name: Preparar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir con el Dockerfile del repositorio
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: salas-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # ---- TP5: tests + coverage + umbral ----
      - name: Construir la etapa de tests
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: test
          load: true
          push: false
          tags: frontend-test:ci
          cache-from: type=gha,scope=frontend-test
          cache-to: type=gha,mode=max,scope=frontend-test

      # vitest sale con 1 si un test falla o si no se cumplen los
      # coverage.thresholds de vite.config.js.
      - name: Correr los tests con coverage (umbral en vite.config.js)
        run: docker run --rm -v "${{ github.workspace }}/out:/out" frontend-test:ci

      - name: Resumen de coverage en la corrida
        if: ${{ !cancelled() }}
        run: |
          f=out/coverage/coverage-summary.json
          {
            echo "## Coverage del frontend (vitest + v8)"
            echo "| Metrica | Cubierto | Total | % |"
            echo "|---|---|---|---|"
            for m in lines branches functions statements; do
              jq -r --arg m "$m" '.total[$m] | "| \($m) | \(.covered) | \(.total) | \(.pct) |"' "$f"
            done
          } >> $GITHUB_STEP_SUMMARY

      - name: Publicar coverage y resultados
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-frontend
          path: |
            out/coverage
            out/tests.xml

      # ---- TP6: publicar el artefacto ----
      # ULTIMOS pasos del job: solo se llega aca si la imagen compilo y los
      # tests + el umbral pasaron. Y solo en main: un PR verifica, no publica.
      # La etiqueta es el commit: sha-<commit> dice exactamente de que codigo
      # salio la imagen. No se publica `latest` (ver decisiones.md, TP6/TP7).
      - name: Entrar al registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Entrar a Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: facuolivam
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y publicar la imagen
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          # El MISMO build se etiqueta en los dos registries: es un solo digest.
          # Docker Hub es el que baja el runner (su Docker no puede leer ghcr.io).
          tags: |
            ghcr.io/facuolivamar/salas-frontend:sha-${{ github.sha }}
            docker.io/facuolivam/salas-frontend:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=frontend

  # ---- TP6: entrega continua ----
  # Plan C: los entornos son proyectos de Compose en el self-hosted runner (la
  # notebook). El deploy lo hace SIEMPRE este job, nunca un compose a mano.
  deploy-qa:
    name: Deploy a QA
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    environment:
      name: qa
      url: http://localhost:8081
    defaults:
      run:
        # Git Bash por ruta corta (sin espacios): el runner es Windows y su shell
        # por defecto es PowerShell, cuyo curl no es curl.
        shell: C:/PROGRA~1/Git/bin/bash.exe --noprofile --norc -eo pipefail {0}
    env:
      TAG: sha-${{ github.sha }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}   # environment secret de qa
    steps:
      - uses: actions/checkout@v4

      - name: Bajar del registry las imagenes de este commit y levantar QA
        run: |
          echo "Desplegando $TAG en QA"
          docker compose -f compose.qa.yml pull backend frontend
          for c in backend frontend; do
            docker image inspect --format "{{index .RepoDigests 0}}" docker.io/facuolivam/salas-$c:$TAG
          done
          docker compose -f compose.qa.yml up -d --remove-orphans

      - name: Smoke test con reintentos
        env:
          URL_API: http://localhost:8001
          URL_WEB: http://localhost:8081
        run: ./scripts/smoke.sh

  # ---- TP7: las pruebas como gate de promocion ----
  # deploy-qa -> integracion -> e2e -> deploy-prod. Sin la del medio la
  # integracion seria un adorno. Ninguna lleva continue-on-error ni || true:
  # si una falla, deploy-prod no arranca.
  integracion:
    name: Integracion contra la api de QA
    needs: deploy-qa
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    defaults:
      run:
        shell: C:/PROGRA~1/Git/bin/bash.exe --noprofile --norc -eo pipefail {0}
        working-directory: frontend
    env:
      API_BASE_URL: http://localhost:8001
      REPORTE: playwright-report-integracion
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias
        run: npm ci
      - name: Suite de integracion (Playwright request, sin navegador)
        # tee guarda la salida para el resumen; con pipefail el codigo de
        # salida sigue siendo el de Playwright (si falla, el job falla).
        run: npx playwright test --project=integracion 2>&1 | tee resultado-integracion.txt

      - name: Resultado en el resumen de la corrida
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## Integracion contra la api de QA"
            echo '```'
            grep -E "^ +[0-9]+ (passed|failed|flaky|skipped|did not run)" resultado-integracion.txt || echo "sin resultado"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publicar el reporte
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-integracion
          path: frontend/playwright-report-integracion

  e2e:
    name: E2E contra QA
    needs: integracion
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    defaults:
      run:
        shell: C:/PROGRA~1/Git/bin/bash.exe --noprofile --norc -eo pipefail {0}
        working-directory: frontend
    env:
      E2E_BASE_URL: http://localhost:8081
      API_BASE_URL: http://localhost:8001
      REPORTE: playwright-report-e2e
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias y navegador
        run: |
          npm ci
          npx playwright install chromium
      - name: Suite e2e (navegador contra QA)
        # tee guarda la salida para el resumen; con pipefail el codigo de
        # salida sigue siendo el de Playwright (si falla, el job falla).
        run: npx playwright test --project=e2e 2>&1 | tee resultado-e2e.txt

      - name: Resultado en el resumen de la corrida
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## E2E contra QA"
            echo '```'
            grep -E "^ +[0-9]+ (passed|failed|flaky|skipped|did not run)" resultado-e2e.txt || echo "sin resultado"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publicar el reporte (con traza y screenshot si falla)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-e2e
          path: |
            frontend/playwright-report-e2e
            frontend/test-results

  deploy-prod:
    name: Deploy a PROD
    needs: e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    # El gate humano: el environment production tiene required reviewer. El
    # job queda en "Waiting for review" hasta que alguien aprueba o rechaza.
    environment:
      name: production
      url: http://localhost:8082
    defaults:
      run:
        # Git Bash por ruta corta (sin espacios): el runner es Windows y su shell
        # por defecto es PowerShell, cuyo curl no es curl.
        shell: C:/PROGRA~1/Git/bin/bash.exe --noprofile --norc -eo pipefail {0}
    env:
      TAG: sha-${{ github.sha }}               # la MISMA imagen que paso QA
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}   # environment secret de production
    steps:
      - uses: actions/checkout@v4

      - name: Bajar del registry la MISMA imagen que verifico QA y levantar PROD
        run: |
          echo "Desplegando $TAG en PROD"
          docker compose -f compose.prod.yml pull backend frontend
          for c in backend frontend; do
            docker image inspect --format "{{index .RepoDigests 0}}" docker.io/facuolivam/salas-$c:$TAG
          done
          docker compose -f compose.prod.yml up -d --remove-orphans

      - name: Smoke test con reintentos
        env:
          URL_API: http://localhost:8002
          URL_WEB: http://localhost:8082
        run: ./scripts/smoke.sh
