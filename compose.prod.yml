# Entorno PROD del plan C: lo levanta el pipeline (job deploy-prod) en el
# self-hosted runner, NUNCA a mano. Diferencias con el entorno hermano:
#   - name: proyecto de Compose propio (sin esto, desplegar uno mata al otro)
#   - puertos del lado host: web 8082, api 8002
#   - volumen propio: cada entorno tiene SU base de datos
# Las imagenes NO se construyen aca: se bajan del registry por la etiqueta
# sha-<commit> que publico el CI. TAG y DB_PASSWORD los pone el pipeline.
name: salas-prod

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: salas
      POSTGRES_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD}
      POSTGRES_DB: salas_prod
    volumes:
      - datos_db_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salas -d salas_prod"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    image: ghcr.io/facuolivamar/salas-backend:${TAG:?falta TAG}
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: salas
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: salas_prod
    ports:
      - "8002:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: ghcr.io/facuolivamar/salas-frontend:${TAG}
    environment:
      # Se lee al arrancar (template de nginx). Es la misma imagen en los dos
      # entornos; lo que cambia es a que api apunta.
      BACKEND_URL: http://backend:8000
    ports:
      - "8082:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  datos_db_prod:
