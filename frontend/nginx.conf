server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: React maneja el ruteo del lado del cliente, asi que cualquier ruta
    # que no corresponda a un archivo real tiene que devolver el index.
    # Sin esto, recargar una URL interna daria 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # El navegador nunca habla directo con el backend: le pega a /api en el
    # mismo origen y nginx reenvia. La direccion del backend NO esta escrita en
    # la imagen: la imagen oficial de nginx corre envsubst sobre este template
    # al arrancar y reemplaza BACKEND_URL por la variable de entorno. Asi la
    # MISMA imagen sirve en QA y en PROD, cada una hablando con su api.
    location /api/ {
        proxy_pass ${BACKEND_URL}/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
