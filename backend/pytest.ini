[pytest]
testpaths = tests
# --cov-fail-under es el UMBRAL QUE ROMPE EL BUILD: si el total queda abajo,
# pytest sale con codigo distinto de 0 aunque todos los tests esten en verde, y
# el `docker run` del pipeline falla. Con branch = True (ver .coveragerc) el
# total de coverage.py combina lineas Y ramas: no alcanza con pasar por una
# linea, tambien hay que recorrer los dos caminos de cada if.
addopts = --cov=app --cov-config=.coveragerc --cov-branch --cov-report=term-missing --cov-fail-under=80
